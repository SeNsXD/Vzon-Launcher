<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 440" width="1240" height="440">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#0B1322" />
    </linearGradient>

    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .pillar-title { font-size: 17px; font-weight: 800; fill: #FFFFFF; }
    .pillar-desc { font-size: 13px; font-weight: 400; fill: #94A3B8; line-height: 20px; }
  </style>

  <!-- Background Base -->
  <rect width="1240" height="440" fill="url(#gridBg)" rx="24" />
  <rect x="1" y="1" width="1238" height="438" rx="23" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Title -->
  <g transform="translate(620, 52)" text-anchor="middle" class="font-sans">
    <text y="0" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5px">ENGINEERED WITHOUT COMPROMISE</text>
    <text y="24" font-size="13" font-weight="500" fill="#64748B">Every line of code and animation curve is purpose-built for perfection.</text>
  </g>

  <!-- 4 Pillars Row -->
  <g transform="translate(50, 114)" class="font-sans">
    
    <!-- Pillar 1: 120Hz Fluid Motion -->
    <g filter="url(#fShadow)">
      <rect x="0" y="0" width="265" height="260" rx="24" fill="#0F172A" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.2" />
      <g transform="translate(26, 26)">
        <rect x="0" y="0" width="48" height="48" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
        <path d="M26 12 L16 26 L24 26 L22 36 L32 22 L24 22 Z" fill="#60A5FA" />
        
        <text x="0" y="80" class="pillar-title">120Hz Fluid Motion</text>
        <text x="0" y="110" class="pillar-desc">
          <tspan x="0" dy="0">Jetpack Compose physics-</tspan>
          <tspan x="0" dy="20">driven springs, zero frame</tspan>
          <tspan x="0" dy="20">drops, and Android 14+</tspan>
          <tspan x="0" dy="20">predictive back transitions.</tspan>
        </text>
      </g>
    </g>

    <!-- Pillar 2: 100% On-Device Privacy -->
    <g transform="translate(290, 0)" filter="url(#fShadow)">
      <rect x="0" y="0" width="265" height="260" rx="24" fill="#0F172A" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.2" />
      <g transform="translate(26, 26)">
        <rect x="0" y="0" width="48" height="48" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <path d="M24 14 L14 18 L14 26 C14 32, 24 36, 24 36 C24 36, 34 32, 34 26 L34 18 Z" fill="none" stroke="#34D399" stroke-width="2" />
        <circle cx="24" cy="25" r="3" fill="#34D399" />
        
        <text x="0" y="80" class="pillar-title">Zero Telemetry</text>
        <text x="0" y="110" class="pillar-desc">
          <tspan x="0" dy="0">Zero analytics SDKs. No</tspan>
          <tspan x="0" dy="20">cloud profiling. Location is</tspan>
          <tspan x="0" dy="20">coarse-only, cached on-device</tspan>
          <tspan x="0" dy="20">and never uploaded.</tspan>
        </text>
      </g>
    </g>

    <!-- Pillar 3: Frosted Glass Aesthetics -->
    <g transform="translate(580, 0)" filter="url(#fShadow)">
      <rect x="0" y="0" width="265" height="260" rx="24" fill="#0F172A" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1.2" />
      <g transform="translate(26, 26)">
        <rect x="0" y="0" width="48" height="48" rx="16" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
        <rect x="14" y="18" width="20" height="14" rx="4" fill="none" stroke="#22D3EE" stroke-width="2" />
        <line x1="14" y1="24" x2="34" y2="24" stroke="#22D3EE" stroke-width="1.5" />
        
        <text x="0" y="80" class="pillar-title">Frosted Glass UI</text>
        <text x="0" y="110" class="pillar-desc">
          <tspan x="0" dy="0">Bespoke floating capsule</tspan>
          <tspan x="0" dy="20">dock, dynamic alpha-tuned</tspan>
          <tspan x="0" dy="20">borders, and adaptive contrast</tspan>
          <tspan x="0" dy="20">over any wallpaper.</tspan>
        </text>
      </g>
    </g>

    <!-- Pillar 4: 8-Tier Intelligent Search -->
    <g transform="translate(870, 0)" filter="url(#fShadow)">
      <rect x="0" y="0" width="265" height="260" rx="24" fill="#0F172A" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.2" />
      <g transform="translate(26, 26)">
        <rect x="0" y="0" width="48" height="48" rx="16" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
        <circle cx="22" cy="22" r="7" fill="none" stroke="#C084FC" stroke-width="2" />
        <line x1="27" y1="27" x2="33" y2="33" stroke="#C084FC" stroke-width="2" stroke-linecap="round" />
        
        <text x="0" y="80" class="pillar-title">8-Tier Fast Search</text>
        <text x="0" y="110" class="pillar-desc">
          <tspan x="0" dy="0">Exact match, prefix, acronym,</tspan>
          <tspan x="0" dy="20">fuzzy subsequence, and</tspan>
          <tspan x="0" dy="20">diacritic-agnostic ranking</tspan>
          <tspan x="0" dy="20">in under 5 milliseconds.</tspan>
        </text>
      </g>
    </g>

  </g>
</svg>